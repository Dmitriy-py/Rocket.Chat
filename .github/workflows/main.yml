name: Hybrid CI/CD RocketChat

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: [self-hosted, local-dev]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: false

      - name: Login to Registry
        run: |
          echo "${{ secrets.YC_OAUTH_TOKEN }}" | docker login --username oauth --password-stdin cr.yandex

      - name: Build and Push
        run: |
          # Устанавливаем переменные окружения, которые нужны docker-compose-ci.yml
          export LOWERCASE_REPOSITORY="dmitriy-py"  # Ваш логин GitHub
          export DOCKER_TAG="${{ github.sha }}"    # Используем короткий SHA коммита как тег
          export DENO_VERSION="1.38.0"             # Установите актуальную версию, если это важно
          
          # Запускаем сборку
          docker-compose -f docker-compose-ci.yml build rocketchat
          
          # Теперь тегируем и пушим, используя собранный образ
          # Тег образа в docker-compose-ci.yml - это ghcr.io/${LOWERCASE_REPOSITORY}/rocket.chat:${DOCKER_TAG}
          IMAGE_NAME="ghcr.io/dmitriy-py/rocket.chat:${{ github.sha }}"
          
          docker tag $IMAGE_NAME cr.yandex/${{ secrets.YC_REGISTRY_ID }}/rocket-chat:${{ github.sha }}
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/rocket-chat:${{ github.sha }}
          
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, production-broker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Deploy to K8s
        run: |
          # --- 1. Установка kubectl (если не установлен в образе раннера) ---
          # Убеждаемся, что kubectl доступен, используя метод, который не требует репозиториев apt
          
          echo "Installing kubectl..."
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          
          # Проверка (для отладки)
          kubectl version --client
          
          # --- 2. Настройка окружения Kubeconfig ---
          # Предполагается, что KUBECONFIG был передан раннеру через env (как вы указали в предыдущем шаге)
          # и что секрет yc-kubeconfig-secret содержит корректный файл kubeconfig.yaml
          
          # 3. Применение манифеста (для создания Namespace, MongoDB, и Deployment с тегом :latest)
          echo "Applying production manifests..."
          kubectl apply -f k8s/production-deployment.yaml -n production
          
          # 4. Обновление образа в Deployment до SHA-тега
          echo "Patching deployment with new image tag..."
          kubectl set image deployment/rocket-chat rocket-chat=cr.yandex/crpkbvrrnvvh2cn7ta1f/rocket-chat:${{ github.sha }} -n production
          
        env:
          # Убеждаемся, что KUBECONFIG явно указан, если он не подхватывается автоматически
          KUBECONFIG: /home/runner/.kube/config