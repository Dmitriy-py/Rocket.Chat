name: Hybrid CI/CD RocketChat

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: [self-hosted, local-dev]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: false

      - name: Login to Registry
        run: |
          echo "${{ secrets.YC_OAUTH_TOKEN }}" | docker login --username oauth --password-stdin cr.yandex

      - name: Build and Push
        run: |
          # Устанавливаем переменные окружения, которые нужны docker-compose-ci.yml
          export LOWERCASE_REPOSITORY="dmitriy-py"  # Ваш логин GitHub
          export DOCKER_TAG="${{ github.sha }}"    # Используем короткий SHA коммита как тег
          export DENO_VERSION="1.38.0"             # Установите актуальную версию, если это важно
          
          # Запускаем сборку
          docker-compose -f docker-compose-ci.yml build rocketchat
          
          # Теперь тегируем и пушим, используя собранный образ
          # Тег образа в docker-compose-ci.yml - это ghcr.io/${LOWERCASE_REPOSITORY}/rocket.chat:${DOCKER_TAG}
          IMAGE_NAME="ghcr.io/dmitriy-py/rocket.chat:${{ github.sha }}"
          
          docker tag $IMAGE_NAME cr.yandex/${{ secrets.YC_REGISTRY_ID }}/rocket-chat:${{ github.sha }}
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/rocket-chat:${{ github.sha }}
          
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, production-broker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Deploy to K8s
        run: |
          # --- УСТАНОВКА KUBECTL ---
          # Скачиваем и устанавливаем kubectl (поскольку его нет в образе раннера)
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          
          # Проверка установки (НЕОБЯЗАТЕЛЬНО, но полезно)
          kubectl version --client

          # --- ПРИМЕНЕНИЕ МАНИФЕСТА И ОБНОВЛЕНИЕ ОБРАЗА ---
          # 1. Применяем манифест (он уже содержит serviceAccount и RoleBinding, но нам нужно убедиться, что он видит новый образ)
          kubectl apply -f k8s/production-deployment.yaml -n production
          
          # 2. Обновляем образ в Deployment, используя SHA тег, который мы собрали
          kubectl set image deployment/rocket-chat rocket-chat=cr.yandex/crpkbvrrnvvh2cn7ta1f/rocket-chat:${{ github.sha }} -n production
        env:
          # Передаем KUBECONFIG, если раннер не имеет доступа к нему автоматически
          KUBECONFIG: /home/runner/.kube/config # Укажите путь, если вы монтируете его